# ====== ai-short config ======

niche: ai_horror             # see src/niches.py for all niche ids

llm:
  provider: openai           # openai (ChatGPT) | anthropic (Claude)
  openai_model: gpt-4o       # gpt-4o | gpt-4o-mini (cheaper)
  anthropic_model: claude-opus-4-8

quality:
  min_viral_score: 75        # 0-100; regenerate script until it hits this
  max_retries: 3             # how many scripts to try before keeping the best

video:
  width: 720                 # generation size (vertical); upscaled to 1080 on assemble
  height: 1280
  fps: 24
  frames_per_scene: 85       # HunyuanVideo wants (4k+1) frames; 85 ≈ 3.5s
  steps: 30                  # diffusion steps (lower = faster, rougher)
  guidance: 6.0
  model: "hunyuanvideo-community/HunyuanVideo"

image:                       # open-source image model for thumbnails (no login)
  model: "SG161222/RealVisXL_V4.0"  # photorealistic faces, ungated, movie-poster look
  width: 768                 # 9:16 portrait (SDXL bucket), cropped to vertical
  height: 1344
  steps: 30                  # quality (RealVisXL needs ~25-35 steps)
  guidance: 7.0
  # Faster but lower quality: "stabilityai/sdxl-turbo" (width/height 1024, steps 4, guidance 0.0)
  # Best quality (needs HF login): "black-forest-labs/FLUX.1-schnell"

thumbnail:
  use_ai: true               # true = FLUX makes a real scary image (needs GPU)
                             # false = plain dark background

output:
  width: 1080                # final short resolution
  height: 1920
  target_seconds: 45         # aim for 35-50s shorts

tts:
  engine: kokoro             # kokoro | f5
  voice: am_michael          # deep American male (good for horror)
  speed: 0.95                # slightly slow = more dramatic

captions:
  whisper_model: small       # small = fast + accurate enough for clear TTS speech
  device: cpu                # cpu = reliable (no cuDNN). use cuda only if cuDNN 8 present
  font: "Arial Black"
  font_size: 22
  primary_color: "&H00FFFFFF"   # white
  highlight_color: "&H0000FFFF" # yellow (current word)
  outline: 3
  margin_v: 320              # push captions up from bottom

music:
  path: "assets/music/dark_ambient.mp3"
  volume: 0.12               # quiet under the voice

paths:
  models_dir: "models"       # mount RunPod network volume here
  output_dir: "output"
